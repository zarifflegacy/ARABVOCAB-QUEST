    window.convertGoogleDriveUrl = function(url) {
      if (!url || typeof url !== 'string') return '';
      const trimmed = url.trim();
      const fileIdMatch = trimmed.match(/\/d\/([a-zA-Z0-9_-]+)/) || trimmed.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (trimmed.includes('drive.google.com') && fileIdMatch && fileIdMatch[1]) {
        return `https://lh3.googleusercontent.com/d/${fileIdMatch[1]}`;
      }
      return trimmed;
    };
    window.convertGoogleDriveAudioUrl = function(url) {
      if (!url || typeof url !== 'string') return '';
      const trimmed = url.trim();
      const fileIdMatch = trimmed.match(/\/d\/([a-zA-Z0-9_-]+)/) || trimmed.match(/[?&]id=([a-zA-Z0-9_-]+)/);

      }
      return trimmed;
    };
    window.speakArabic = function(arabicText, customAudioUrl = '') {
      try {
        if (customAudioUrl) {
          const directAudio = convertGoogleDriveAudioUrl(customAudioUrl);
          const audio = new Audio(directAudio);
          audio.play().catch(() => fallbackTTS(arabicText));
          return;
        }
        fallbackTTS(arabicText);
      } catch (e) {
        fallbackTTS(arabicText);
      }
    };
    function fallbackTTS(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ar-SA';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
        showToast('🔊 Memainkan sebutan bahasa Arab...', 'info');
      } else {
        showToast('Pelayar anda tidak menyokong audio suara.', 'warning');
      }

    window.showToast = function(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const colors = {
        success: 'bg-emerald-600 border-emerald-800 text-white',
        error: 'bg-rose-600 border-rose-800 text-white',
        warning: 'bg-amber-500 border-amber-700 text-amber-950',
        info: 'bg-sky-600 border-sky-800 text-white'
      };
      const icons = { success: '✅', error: '❌', warning: '⚠️', info: '💡' };
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-xl border-b-4 font-bold text-sm transform transition-all duration-300 translate-y-0 ${colors[type] || colors.info}`;
      toast.innerHTML = `<span>${icons[type] || '🔔'}</span><span class="flex-1">${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-10px)';
        setTimeout(() => toast.remove(), 300);

    // =========================================================================

    function getMostRecentSundayResetTimestamp(nowMs = Date.now()) {
      const d = new Date(nowMs);
      const dayOfWeek = d.getDay(); // 0 = Sunday
      const lastReset = new Date(d);
      lastReset.setDate(d.getDate() - dayOfWeek);
      lastReset.setHours(23, 59, 0, 0);
      if (lastReset.getTime() > nowMs) {
        lastReset.setDate(lastReset.getDate() - 7);
      }
      return lastReset.getTime();
    }
    function getNextSundayResetDate(nowMs = Date.now()) {
      const d = new Date(nowMs);
      const dayOfWeek = d.getDay();
      const daysUntilSunday = (7 - dayOfWeek) % 7;
      const nextReset = new Date(d);
      nextReset.setDate(d.getDate() + daysUntilSunday);
      nextReset.setHours(23, 59, 0, 0);
      if (nextReset.getTime() <= nowMs) {
        nextReset.setDate(nextReset.getDate() + 7);
      }
      return nextReset;
    }

    function isAppsScriptConfigured() {
      return typeof API_URL === 'string' && API_URL.trim() !== '' && API_URL !== 'PASTE_APPS_SCRIPT_URL' && API_URL.startsWith('http');
    }

    function applyRemotePayload(remote) {
      if (!remote || typeof remote !== 'object') return;
      if (remote.settings) appState.settings = { ...DEFAULT_SETTINGS, ...remote.settings };
      if (Array.isArray(remote.homeSections)) appState.homeSections = remote.homeSections;
      if (Array.isArray(remote.vocabulary)) appState.vocabulary = remote.vocabulary;
      if (Array.isArray(remote.levels)) appState.levels = remote.levels;
      if (Array.isArray(remote.shopItems)) appState.shopItems = remote.shopItems;
      if (Array.isArray(remote.coinPackages)) appState.coinPackages = remote.coinPackages;
      if (Array.isArray(remote.users) && remote.users.length > 0) appState.users = remote.users;
      if (remote.lastWeeklyResetAt) appState.lastWeeklyResetAt = remote.lastWeeklyResetAt;
      if (Array.isArray(remote.auditLogs)) appState.auditLogs = remote.auditLogs;
    }

    function buildSerializablePayload() {
      return {
        settings: appState.settings,
        homeSections: appState.homeSections,
        vocabulary: appState.vocabulary,
        levels: appState.levels,
        shopItems: appState.shopItems,
        coinPackages: appState.coinPackages,
        users: appState.users,
        lastWeeklyResetAt: appState.lastWeeklyResetAt,
        auditLogs: appState.auditLogs.slice(0, 60)
      };
    }

    async function initStorage() {
      // 1. Muat daripada LocalStorage terlebih dahulu untuk paparan pantas
      try {
        const cached = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (cached) {
          applyRemotePayload(JSON.parse(cached));
        }
      } catch (e) {
        console.warn('Local cache read warning:', e);
      }

      // 2. Muat daripada Google Apps Script Backend jika API_URL telah dikonfigurasi
      if (isAppsScriptConfigured()) {
        try {
          const response = await fetch(`${API_URL}?action=getState`, {
            method: 'GET',
            redirect: 'follow'
          });
          if (response.ok) {
            const resJson = await response.json();
            if (resJson && resJson.status === 'success' && resJson.data) {
              applyRemotePayload(resJson.data);
              localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(buildSerializablePayload()));
            } else if (resJson && resJson.status === 'empty') {
              await persistAppState();
            }
          }
        } catch (err) {
          console.warn('Apps Script fetch warning:', err);
        }
      }

      // 3. Muat daripada Firebase jika persekitaran menyediakannya
      try {
        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
          const firebaseConfig = JSON.parse(__firebase_config);
          const fbApp = initializeApp(firebaseConfig);
          auth = getAuth(fbApp);
          db = getFirestore(fbApp);
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }
          firebaseReady = true;
          const stateDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'app_state', 'master_v3');
          const snap = await getDoc(stateDocRef);
          if (snap.exists()) {
            applyRemotePayload(snap.data());
          } else {
            await persistAppState();
          }
          onSnapshot(stateDocRef, (docSnap) => {
            if (docSnap.exists()) {
              applyRemotePayload(docSnap.data());
              refreshUI();
            }
          });
        }
      } catch (e) {
        console.warn('Standalone mode active:', e);
      }

      if (checkAndResetWeeklyLeague()) persistAppState();
      refreshUI();
    }

    async function persistAppState() {
      const payload = buildSerializablePayload();

      // 1. Simpan ke LocalStorage sebagai sandaran pantas
      try {
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(payload));
      } catch (e) {
        console.warn('LocalStorage save warning:', e);
      }

      // 2. Hantar dan simpan ke Google Apps Script Backend (Google Sheets)
      if (isAppsScriptConfigured()) {
        try {
          fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
              'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify({
              action: 'saveState',
              data: payload
            })
          }).catch(err => console.warn('Apps Script sync error:', err));
        } catch (e) {
          console.warn('Apps Script post warning:', e);
        }
      }

      // 3. Simpan ke Firebase Firestore jika aktif
      try {
        if (firebaseReady && db && auth?.currentUser) {
          const stateDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'app_state', 'master_v3');
          await setDoc(stateDocRef, payload);
        }
      } catch (e) {
        console.warn('Persist warning:', e);
      }
    }

        return false;
      }
      const now = Date.now();
      if (!user.nextLifeRefillAt) {
        user.nextLifeRefillAt = now + LIFE_REFILL_MS;
        return true;
      }
      let changed = false;
      while (user.lives < MAX_LIVES && now >= user.nextLifeRefillAt) {
        user.lives += 1;
        changed = true;
        if (user.lives < MAX_LIVES) {
          user.nextLifeRefillAt += LIFE_REFILL_MS;
        } else {
          user.nextLifeRefillAt = null;
        }
      }
      return changed;
    }

      if (!user) return;
      syncUserLives(user);
      user.lives = Math.max(0, (user.lives ?? MAX_LIVES) - 1);

    // =========================================================================
    // 10. QUIZ ENGINE

    window.startLevelSet = function(levelNum, setNum) {
      const user = getCurrentUser();
      if (!user) return openAuthModal('login');
      syncUserLives(user);
      if ((user.lives ?? MAX_LIVES) <= 0) {
        openLivesInfoModal();
        return;
      }
      const level = appState.levels.find(l => l.levelNum === levelNum);
      if (!level) return;
      const setObj = (level.sets || []).find(s => s.setNum === setNum);
      if (!setObj) return;
      const setVocabs = (setObj.vocabIds || [])
        .map(id => appState.vocabulary.find(v => v.id === id))
        .filter(Boolean);
      if (setVocabs.length === 0) {
        showToast('Set ini belum mempunyai perkataan. Sila hubungi Super Admin.', 'error');
        return;
      }
      const questions = setVocabs.map(targetVocab => {
        const distractors = appState.vocabulary
          .filter(v => v.id !== targetVocab.id)
          .sort(() => Math.random() - 0.5)
          .slice(0, 3);
        const options = [targetVocab, ...distractors].sort(() => Math.random() - 0.5);
        return { target: targetVocab, options, type: level.type };
      });
      appState.activeQuiz = {
        level,
        setObj,
        questions,
        currentIndex: 0,
        correctCount: 0,
        answered: false,
        isCorrectLast: false,
        selectedLetters: [],
        selectedWords: [],
        shuffledTokens: []
      };
      prepareQuestionTokens();
      navigateTo('quiz');
    };
    function prepareQuestionTokens() {
      const qState = appState.activeQuiz;
      if (!qState) return;
      const currentQ = qState.questions[qState.currentIndex];
      qState.answered = false;
      qState.selectedLetters = [];
      qState.selectedWords = [];
      if (currentQ.type === 'arrange_letters') {
        const chars = Array.from(currentQ.target.arabic.replace(/\s+/g, ''));
        qState.shuffledTokens = chars.map((ch, idx) => ({ id: idx, text: ch, used: false })).sort(() => Math.random() - 0.5);
      } else if (currentQ.type === 'arrange_sentence') {
        const sentence = currentQ.target.sentenceAr || `هٰذَا ${currentQ.target.arabic}`;
        const words = sentence.trim().split(/\s+/);
        qState.shuffledTokens = words.map((w, idx) => ({ id: idx, text: w, used: false })).sort(() => Math.random() - 0.5);
      }
    }

    function initWritingCanvas() {
      const canvas = document.getElementById('writing-canvas');
      if (!canvas) return;
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      const ctx = canvas.getContext('2d');
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#0F172A';
      let drawing = false;
      const getPos = (e) => {
        const r = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - r.left, y: clientY - r.top };
      };
      const startDraw = (e) => { drawing = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); };
      const moveDraw = (e) => { if (!drawing) return; e.preventDefault(); const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); };
      const endDraw = () => { drawing = false; };
      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', moveDraw);
      window.addEventListener('mouseup', endDraw);
      canvas.addEventListener('touchstart', startDraw, { passive: false });
      canvas.addEventListener('touchmove', moveDraw, { passive: false });
      canvas.addEventListener('touchend', endDraw);
    }
    window.clearWritingCanvas = function() {
      const canvas = document.getElementById('writing-canvas');
      if (!canvas) return;

    };

    window.pickArrangedToken = function(mode, tokenId) {
      const qState = appState.activeQuiz;

      if (!tok || tok.used) return;

      if (mode === 'letters') qState.selectedLetters.push(tok);

        bodyHtml: `<p>Padam pakej <strong>${pkg.coins} Coin (RM ${pkg.priceRm})</strong>?</p>`,
        actionsHtml: `
          <button onclick="executeDeleteCoinPackage(${idx})" class="btn-3d px-5 py-2 rounded-xl bg-rose-600 text-white font-bold text-xs border-rose-800">Ya, Padam</button>
          <button onclick="closeModal()" class="btn-3d px-4 py-2 rounded-xl bg-slate-200 text-slate-700 font-bold text-xs border-slate-300">Batal</button>
        `
      });
    };
    window.executeDeleteCoinPackage = function(idx) {
      const pkg = appState.coinPackages[idx];
      appState.coinPackages.splice(idx, 1);
      addAuditLog(`Memadam pakej Coin: ${pkg ? pkg.coins + ' Coin' : idx}`);
      persistAppState();
      closeModal();
      refreshUI();
      showToast('Pakej Coin dipadam.', 'info');
    };
    window.openShopItemFormModal = function(idx = null) {
      const isEdit = idx !== null && appState.shopItems[idx];
      const item = isEdit ? appState.shopItems[idx] : { category: 'hairStyle', partId: 'hair_spiky', name: '', price: 50, desc: '' };
      const catKeys = Object.keys(CATEGORY_LABELS).filter(k => k !== 'all');
      openModal({
        icon: '🛍️',
        title: isEdit ? 'Sunting Item Kedai' : 'Tambah Item Kedai Baharu',
        bodyHtml: `
          <form onsubmit="saveShopItemAdmin(event, ${isEdit ? idx : -1})" class="text-left space-y-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Kategori Karakter LEGO 3D / Item</label>
              <select id="si-cat" class="w-full px-3 py-2 rounded-xl border-2 border-slate-200 text-xs font-bold bg-white">
                ${catKeys.map(k => `<option value="${k}" ${item.category === k ? 'selected' : ''}>${CATEGORY_LABELS[k]}</option>`).join('')}
              </select>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Nama Item</label>
                <input type="text" id="si-name" required value="${item.name}" placeholder="Contoh: Rambut Pacak" class="w-full px-3 py-2 rounded-xl border-2 border-slate-200 text-sm font-bold" />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Harga (Coin)</label>
                <input type="number" id="si-price" required min="1" value="${item.price}" class="w-full px-3 py-2 rounded-xl border-2 border-slate-200 text-sm font-bold" />
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Kod Bahagian Karakter LEGO (partId)</label>
              <input type="text" id="si-part" required value="${item.partId}" placeholder="Contoh: hair_spiky, sh_chef, bg_backpack, life_refill" class="w-full px-3 py-2 rounded-xl border-2 border-slate-200 text-xs font-mono" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Huraian Ringkas</label>
              <input type="text" id="si-desc" value="${item.desc || ''}" class="w-full px-3 py-2 rounded-xl border-2 border-slate-200 text-xs" />
            </div>
            <button type="submit" class="btn-3d w-full py-3 rounded-2xl bg-emerald-500 text-white font-bold text-sm border-emerald-700">Simpan Item Kedai</button>
          </form>
        `,
        actionsHtml: `<button onclick="closeModal()" class="text-xs font-bold text-slate-400">Batal</button>`
      });
    };
    window.saveShopItemAdmin = function(e, idx) {
      e.preventDefault();
      const payload = {
        id: idx >= 0 ? appState.shopItems[idx].id : `shop_${Date.now()}`,
        category: document.getElementById('si-cat').value,
        name: document.getElementById('si-name').value.trim(),
        price: parseInt(document.getElementById('si-price').value, 10) || 10,
        partId: document.getElementById('si-part').value.trim(),
        desc: document.getElementById('si-desc').value.trim()
      };
      if (idx >= 0) {
        appState.shopItems[idx] = payload;
        addAuditLog(`Mengemas kini item kedai: ${payload.name} (${payload.price} Coin)`);
      } else {
        appState.shopItems.push(payload);
        addAuditLog(`Menambah item kedai baharu: ${payload.name} (${payload.price} Coin)`);
      }
      persistAppState();
      closeModal();
      refreshUI();
      showToast('Item kedai berjaya disimpan!', 'success');
    };
    window.confirmDeleteShopItem = function(idx) {
      const it = appState.shopItems[idx];
      openModal({
        icon: '⚠️',
        title: 'Sahkan Pemadaman Item Kedai',
        bodyHtml: `<p>Adakah anda pasti ingin memadam item <strong>${it.name}</strong> daripada kedai?</p>`,
        actionsHtml: `
          <button onclick="executeDeleteShopItem(${idx})" class="btn-3d px-5 py-2 rounded-xl bg-rose-600 text-white font-bold text-xs border-rose-800">Ya, Padam</button>
          <button onclick="closeModal()" class="btn-3d px-4 py-2 rounded-xl bg-slate-200 text-slate-700 font-bold text-xs border-slate-300">Batal</button>
        `
      });
    };
    window.executeDeleteShopItem = function(idx) {
      const it = appState.shopItems[idx];
      appState.shopItems.splice(idx, 1);
      addAuditLog(`Memadam item kedai: ${it ? it.name : idx}`);
      persistAppState();
      closeModal();
      refreshUI();
      showToast('Item kedai telah dipadam.', 'info');
    };
    // --- ADMIN TAB 4: USERS, TOPUP COIN & LIVES MANAGEMENT ---
    function renderAdminUsersTab() {
      return `
        <div class="mb-5 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
          <div>
            <h2 class="font-title text-xl font-bold text-slate-800">Pengurusan Murid, Topup Coin & Nyawa</h2>
            <p class="text-xs text-slate-500">Tambah atau tolak Coin murid (selepas pengesahan topup WhatsApp), tambah nyawa, atau nyahaktifkan akaun.</p>
          </div>
          <button onclick="manualResetWeeklyLeague()" class="btn-3d px-4 py-2 rounded-xl bg-amber-400 text-amber-950 font-bold text-xs border-amber-600">
            🔄 Reset Liga Mingguan Sekarang
          </button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-sm">
            <thead>
              <tr class="bg-slate-100 text-slate-700 text-xs uppercase">
                <th class="p-3 rounded-tl-xl">ID Murid</th>
                <th class="p-3">Nama Murid</th>
                <th class="p-3">XP / Mingguan</th>
                <th class="p-3">Nyawa</th>
                <th class="p-3">Baki Coin</th>
                <th class="p-3 rounded-tr-xl text-right">Kawalan Coin, Nyawa & Status</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              ${appState.users.map(u => `
                <tr class="${u.active === false ? 'bg-rose-50/50 opacity-70' : ''}">
                  <td class="p-3 font-mono font-bold text-xs text-purple-700">${u.id}</td>
                  <td class="p-3">
                    <div class="font-bold text-slate-800">${u.displayName}</div>
                    <div class="text-xs text-slate-400">@${u.username}</div>
                  </td>
                  <td class="p-3 font-bold text-sky-600">${u.xp || 0} XP <span class="text-xs text-slate-400">(Mgg: ${u.weeklyXp ?? u.xp ?? 0})</span></td>
                  <td class="p-3 font-bold text-rose-600">${u.lives ?? MAX_LIVES}/${MAX_LIVES} ❤️</td>
                  <td class="p-3 font-extrabold text-amber-700">🪙 ${u.coins || 0}</td>
                  <td class="p-3 text-right whitespace-nowrap space-x-1">
                    <button onclick="adjustUserCoins('${u.id}', 100)" class="px-2.5 py-1.5 rounded-lg bg-emerald-100 text-emerald-800 font-bold text-xs">+100 🪙</button>
                    <button onclick="openCustomTopupModal('${u.id}')" class="px-2.5 py-1.5 rounded-lg bg-amber-100 text-amber-800 font-bold text-xs">Topup / Tolak</button>
                    <button onclick="refillUserLivesAdmin('${u.id}')" class="px-2.5 py-1.5 rounded-lg bg-rose-100 text-rose-700 font-bold text-xs">+Nyawa 5/5</button>
                    <button onclick="toggleUserActiveStatus('${u.id}')" class="px-2.5 py-1.5 rounded-lg ${u.active === false ? 'bg-sky-100 text-sky-700' : 'bg-slate-200 text-slate-700'} font-bold text-xs">
                      ${u.active === false ? 'Aktifkan' : 'Nyahaktif'}
                    </button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }
    window.manualResetWeeklyLeague = function() {
      appState.users.forEach(u => { u.weeklyXp = 0; });
      appState.lastWeeklyResetAt = Date.now();
      addAuditLog('Super Admin melaksanakan reset manual Liga Mingguan.');
      persistAppState();
      refreshUI();
      showToast('Semua mata XP Liga Mingguan telah di-reset kepada 0!', 'success');
    };
    window.adjustUserCoins = function(userId, delta) {
      const target = appState.users.find(u => u.id === userId);
      if (!target) return;
      target.coins = Math.max(0, (target.coins || 0) + delta);
      addAuditLog(`Mengubah Coin murid ${target.displayName} (${target.id}) sebanyak ${delta > 0 ? '+' + delta : delta}. Baki: ${target.coins}`);
      persistAppState();
      refreshUI();
      showToast(`Coin ${target.displayName} dikemas kini (${target.coins} Coin).`, 'success');
    };
    window.refillUserLivesAdmin = function(userId) {
      const target = appState.users.find(u => u.id === userId);
      if (!target) return;
      target.lives = MAX_LIVES;
      target.nextLifeRefillAt = null;
      addAuditLog(`Memulihkan nyawa murid ${target.displayName} (${target.id}) kepada 5/5.`);
      persistAppState();
      refreshUI();
      showToast(`Nyawa ${target.displayName} dipulihkan penuh (5/5)!`, 'success');
    };
    window.openCustomTopupModal = function(userId) {
      const target = appState.users.find(u => u.id === userId);
      if (!target) return;
      openModal({
        icon: '🪙',
        title: `Urus Coin: ${target.displayName}`,
        bodyHtml: `
          <p class="text-xs text-slate-500 mb-3">Baki semasa: <strong>${target.coins || 0} Coin</strong>. Masukkan nilai positif untuk tambah atau negatif untuk tolak.</p>
          <form onsubmit="submitCustomTopup(event, '${userId}')" class="space-y-3">
            <input type="number" id="custom-coin-delta" required placeholder="Contoh: 300 atau -50"
                   class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 text-center font-bold text-base" />
            <button type="submit" class="btn-3d w-full py-2.5 rounded-xl bg-amber-400 text-amber-950 font-bold text-sm border-amber-600">
              Sahkan Perubahan Coin
            </button>
          </form>
        `,
        actionsHtml: `<button onclick="closeModal()" class="text-xs font-bold text-slate-400">Batal</button>`
      });
    };
    window.submitCustomTopup = function(e, userId) {
      e.preventDefault();
      const delta = parseInt(document.getElementById('custom-coin-delta').value, 10);
      if (isNaN(delta) || delta === 0) return;
      adjustUserCoins(userId, delta);
      closeModal();
    };
    window.toggleUserActiveStatus = function(userId) {
      const target = appState.users.find(u => u.id === userId);
      if (!target) return;
      target.active = target.active === false ? true : false;
      addAuditLog(`${target.active ? 'Mengaktifkan' : 'Menyahaktifkan'} akaun murid: ${target.displayName} (${target.id})`);
      persistAppState();
      refreshUI();
      showToast(`Status akaun ${target.displayName} dikemas kini.`, 'info');
    };
    // --- ADMIN TAB 5: GLOBAL SETTINGS, HARGA TUKAR NAMA PAPARAN & CREDENTIALS ---
    function renderAdminSettingsTab() {
      const s = appState.settings;
      return `
        <form onsubmit="saveGlobalSettings(event)" class="max-w-2xl space-y-5">
          <div>
            <h2 class="font-title text-xl font-bold text-slate-800">Tetapan Aplikasi, Harga Tukar Nama & Kredensial</h2>
            <p class="text-xs text-slate-500">Kemas kini nama aplikasi, harga Coin untuk murid tukar nama paparan, logo URL, nombor WhatsApp dan akaun Super Admin.</p>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Nama Aplikasi</label>
              <input type="text" id="set-app-name" required value="${s.appName}"
                     class="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 text-sm font-bold" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Nombor WhatsApp Topup (Format: 6012...)</label>
              <input type="text" id="set-wa" required value="${s.whatsappNumber}"
                     class="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 text-sm font-bold" />
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">URL Logo Aplikasi (Sokong pautan gambar Google Drive)</label>
            <input type="url" id="set-logo-url" value="${s.appLogoUrl || ''}" placeholder="https://drive.google.com/file/d/..."
                   class="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 text-xs" />
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Harga Tukar Nama Paparan (Coin)</label>
              <input type="number" id="set-rename-cost" required min="0" value="${s.renameNameCost ?? 50}"
                     class="w-full px-3.5 py-2.5 rounded-xl border-2 border-amber-300 bg-amber-50/40 text-sm font-bold" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Ganjaran Coin Peti Harta</label>
              <input type="number" id="set-treasure-coins" required min="1" value="${s.treasureCoins || 25}"
                     class="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 text-sm font-bold" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Ganjaran XP Peti Harta</label>
              <input type="number" id="set-treasure-xp" required min="1" value="${s.treasureXp || 15}"
                     class="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 text-sm font-bold" />
            </div>
          </div>
          <div class="flex items-center gap-3 p-3.5 rounded-2xl bg-slate-50 border border-slate-200">
            <input type="checkbox" id="set-leaderboard" ${s.leaderboardEnabled ? 'checked' : ''} class="w-5 h-5 accent-emerald-600" />
            <label for="set-leaderboard" class="text-sm font-bold text-slate-700">Aktifkan Paparan Liga Mingguan (Leaderboard)</label>
          </div>
          <div class="p-4 rounded-2xl bg-amber-50 border-2 border-amber-200 space-y-3">
            <h3 class="font-bold text-sm text-amber-900">🔐 Kredensial Log Masuk Super Admin</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">ID Super Admin</label>
                <input type="text" id="set-sa-id" required value="${s.superAdminId}"
                       class="w-full px-3.5 py-2 rounded-xl border-2 border-amber-300 bg-white text-sm font-bold" />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Kata Laluan Super Admin</label>
                <input type="text" id="set-sa-pass" required value="${s.superAdminPass}"
                       class="w-full px-3.5 py-2 rounded-xl border-2 border-amber-300 bg-white text-sm font-bold" />
              </div>
            </div>
          </div>
          <button type="submit" class="btn-3d px-6 py-3 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-sm border-emerald-700">
            💾 Simpan Semua Tetapan
          </button>
        </form>
      `;
    }
    window.saveGlobalSettings = function(e) {
      e.preventDefault();
      appState.settings.appName = document.getElementById('set-app-name').value.trim();
      appState.settings.whatsappNumber = document.getElementById('set-wa').value.trim();
      appState.settings.appLogoUrl = document.getElementById('set-logo-url').value.trim();
      appState.settings.renameNameCost = Math.max(0, parseInt(document.getElementById('set-rename-cost').value, 10) || 0);
      appState.settings.treasureCoins = parseInt(document.getElementById('set-treasure-coins').value, 10) || 25;
      appState.settings.treasureXp = parseInt(document.getElementById('set-treasure-xp').value, 10) || 15;
      appState.settings.leaderboardEnabled = document.getElementById('set-leaderboard').checked;
      appState.settings.superAdminId = document.getElementById('set-sa-id').value.trim();
      appState.settings.superAdminPass = document.getElementById('set-sa-pass').value;
      addAuditLog(`Mengemas kini tetapan global aplikasi (Caj tukar nama paparan: ${appState.settings.renameNameCost} Coin).`);
      persistAppState();
      refreshUI();
      showToast('Semua tetapan berjaya disimpan!', 'success');
    };
    // --- ADMIN TAB 6: AUDIT LOGS ---
    function renderAdminAuditTab() {
      return `
        <div>
          <h2 class="font-title text-xl font-bold text-slate-800 mb-1">Log Audit Aktiviti Pentadbir</h2>
          <p class="text-xs text-slate-500 mb-4">Rekod perubahan yang dilakukan melalui Panel Super Admin.</p>
          <div class="space-y-2 max-h-96 overflow-y-auto">
            ${appState.auditLogs.map(log => `
              <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-1 text-xs">
                <div>
                  <span class="font-extrabold text-slate-800">${log.actor}:</span>
                  <span class="text-slate-600 ml-1">${log.action}</span>
                </div>
                <span class="text-slate-400 font-mono text-[11px] shrink-0">${log.time}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }
    // =========================================================================
    // 17. BOOTSTRAP APPLICATION
    // =========================================================================
    initStorage();
  </script>
</body>
</html>
